<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FAF8F5" />
    <title>PokéDo — Your board</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body
    class="signed-out"
    data-starter="1"
    data-scope="mine"
    data-focus="false"
  >
    <section class="login-screen" aria-labelledby="login-title">
      <div class="login-card">
        <span class="pokeball" aria-hidden="true"></span>
        <h1 id="login-title">Welcome to PokéDo</h1>
        <form id="login-form">
          <label class="field"
            >Username<input
              id="login-name"
              name="username"
              type="text"
              autocomplete="username"
              required
              maxlength="64"
              autocapitalize="none"
              spellcheck="false" /></label
          ><label class="field"
            >Password<input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              maxlength="128"
          /></label>
          <p id="login-error" role="alert"></p>
          <button type="submit" class="primary" id="login-submit" disabled>
            Sign in
          </button>
        </form>
      </div>
    </section>
    <aside class="sidebar">
      <a href="./" class="brand"
        ><span class="pokeball"></span>poké<span>do</span><sup>✦</sup></a
      >
      <div class="workspace-label">WORKSPACE</div>
      <button class="nav-item active" id="board-nav">
        <span>▦</span> Board</button
      ><button class="nav-item" id="focus-nav"><span>◎</span> Focus</button>
      <div class="trainer-card">
        <div class="avatar">A</div>
        <div><strong id="sidebar-name"></strong></div>
      </div>
    </aside>
    <div class="shell">
      <header class="topbar">
        <span
          >Workspace <span class="crumb">/</span> <strong>Board</strong></span
        >
        <div class="trainer-switch">
          <span id="account-name"></span
          ><button class="secondary" id="refresh" type="button">Refresh</button
          ><button class="secondary" id="change-password" type="button">
            Password</button
          ><button class="secondary" id="logout" type="button">Sign out</button>
        </div>
      </header>
      <main id="main">
        <div class="page-heading">
          <div>
            <h1>Your board<span>.</span></h1>
          </div>
          <button class="primary" id="new-task">＋ New task</button>
        </div>
        <section class="welcome">
          <div>
            <p class="eyebrow">YOUR GROWTH BUDDY</p>
            <h2>One step at a time.</h2>
            <button id="choose-starter" class="starter-trigger" type="button">
              Choose starter</button
            ><button id="welcome-focus" class="subtle-button">
              Focus <span>↗</span>
            </button>
            <div class="buddy-progress">
              <p id="buddy-progress-label" class="buddy-progress-label">
                0 of 0 tasks done
              </p>
              <div
                id="buddy-progress-bar"
                class="buddy-progress-track"
                role="progressbar"
                aria-label="Task progress"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
              >
                <div id="buddy-progress-fill" class="buddy-progress-fill"></div>
              </div>
            </div>
          </div>
          <div class="welcome-art" aria-hidden="true">
            <div class="orbit"></div>
            <span class="spark one">✦</span><span class="spark two">✧</span
            ><img
              src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/1.png"
              alt=""
              width="150"
              height="150"
            /><span class="companion-label">BULBASAUR / YOUR GROWTH BUDDY</span>
          </div>
        </section>
        <div class="board-toolbar">
          <div class="tabs" role="group" aria-label="Task visibility">
            <button data-scope="mine" aria-pressed="true">Mine</button
            ><button data-scope="ours" aria-pressed="false">Ours</button>
          </div>
          <label class="search"
            ><span aria-hidden="true">⌕</span
            ><input
              type="search"
              id="search"
              placeholder="Search tasks…"
              aria-label="Search tasks"
          /></label>
        </div>
        <div class="board-context">
          <span id="scope-caption">Personal tasks</span
          ><span id="progress-summary"></span>
        </div>
        <section
          class="board"
          id="board"
          aria-label="Kanban task board"
        ></section>
        <footer>
          <span>PokéDo</span><span>Unofficial · PokéAPI sprites</span>
        </footer>
      </main>
    </div>
    <dialog id="task-dialog" aria-labelledby="dialog-label">
      <div class="dialog-heading">
        <span class="eyebrow" id="dialog-label">POKÉDO</span
        ><button
          id="close-dialog"
          class="icon-button"
          aria-label="Close dialog"
        >
          ×
        </button>
      </div>
      <div id="dialog-content"></div>
    </dialog>
    <dialog
      id="evolution-dialog"
      class="evolution-dialog"
      aria-labelledby="evolution-title"
    >
      <div id="evolution-content"></div>
    </dialog>
    <div id="toast" role="status" aria-live="polite" class="toast" hidden></div>
    <script src="app.js" defer></script>
  </body>
</html>
